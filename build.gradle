// What every module shares: the plugins on the classpath and the repositories. The modules are
// :shared (the game), :androidApp and :desktopApp (its applications), see docs/multiplatform-game.md.
buildscript {
    ext {
        kotlin_version = '2.4.10'
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
    }
}

allprojects {
    repositories {
        // Libraries Verktex uses that are published nowhere, see verktex/maven/README.md.
        maven { url "$rootDir/verktex/maven" }
        maven { url 'https://jitpack.io' }
        google()
        mavenCentral()
    }
}
