pluginManagement  {
    repositories {
        google()
        mavenCentral()
    }
}

// Verktex, the engine, is its own build (see verktex/docs/extraction.md), included here so that
// com.reco1l.verktex:verktex resolves to its project, whose Android or desktop variant each module
// of the game gets. Its tasks run as :verktex:<project>:<task>.
//
// It reads the SDK's path from its own local.properties, which is copied from the game's when
// it's missing.
def verktexProperties = new File(rootDir, 'verktex/local.properties')
def gameProperties = new File(rootDir, 'local.properties')
if (!verktexProperties.exists() && gameProperties.exists()) {
    verktexProperties.bytes = gameProperties.bytes
}

includeBuild('verktex')

// The platform independent part of the game, see docs/multiplatform-game.md.
include ':game'

// The desktop launcher of the game, over Verktex's desktop target.
include ':game-desktop'
